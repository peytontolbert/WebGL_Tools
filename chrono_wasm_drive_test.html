<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chrono WASM Drive Test (350Z)</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #07090d; overflow: hidden; }
    html { color-scheme: dark; }
    *, *::before, *::after { box-sizing: border-box; }
    #glCanvas { width: 100vw; height: 100vh; display: block; }
    #hud {
      position: fixed;
      left: 12px;
      top: 12px;
      z-index: 10;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(10px);
      color: rgba(234, 240, 255, 0.95);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 12px;
      line-height: 1.35;
      pointer-events: auto;
      user-select: text;
      white-space: pre;
      max-width: min(520px, calc(100vw - 24px));
    }
    #hud b { font-weight: 800; }

    #debugPanel {
      position: fixed;
      right: 12px;
      top: 12px;
      z-index: 11;
      width: min(520px, calc(100vw - 24px));
      display: none;
      gap: 8px;
      flex-direction: column;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(0,0,0,0.62);
      backdrop-filter: blur(10px);
      color: rgba(234, 240, 255, 0.95);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      font-size: 12px;
      pointer-events: auto;
    }
    #debugRow { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
    #debugRow .hint { opacity: 0.78; font-size: 11px; }
    #copyStatusBtn {
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.07);
      color: rgba(234, 240, 255, 0.95);
      padding: 7px 10px;
      font-size: 12px;
    }
    #copyStatusBtn:hover { background: rgba(255,255,255,0.12); }
    #statusText {
      width: 100%;
      height: 220px;
      resize: vertical;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.05);
      color: rgba(234, 240, 255, 0.95);
      padding: 8px 10px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "JetBrains Mono", monospace;
      font-size: 11px;
      line-height: 1.35;
      outline: none;
    }
  </style>
</head>
<body>
  <canvas id="glCanvas"></canvas>
  <div id="hud">Loading…</div>
  <div id="debugPanel">
    <div id="debugRow">
      <button id="copyStatusBtn" type="button">Copy status</button>
      <div class="hint">Press P to toggle · Shift+C to copy</div>
    </div>
    <textarea id="statusText" readonly spellcheck="false"></textarea>
  </div>
  <script type="module" src="./js/chrono_wasm_drive_test.js?v=2026-03-04-full-e2e-reset-telemetry-1"></script>
</body>
</html>
